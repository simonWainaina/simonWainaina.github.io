{% extends "base.html" %}

{% block title %}{{ page.title }} · {{ site.title }}{% endblock %}

{% block content %}
<article class="page page-{{ page.slug }}">
  <h1>{{ page.title }}</h1>
  <div class="prose">
    {{ page.html | safe }}
  </div>
  {% if news %}{% include "_news.html" %}{% endif %}
</article>
{% endblock %}
