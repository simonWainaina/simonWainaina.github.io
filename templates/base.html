<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ site.title }}{% endblock %}</title>
  <meta name="description" content="{% block description %}{{ site.tagline }}{% endblock %}">
  <meta property="og:site_name" content="{{ site.title }}">
  <meta property="og:title" content="{{ self.title() }}">
  <meta property="og:description" content="{{ self.description() }}">
  {% if photo %}<meta property="og:image" content="{{ site.url }}{{ photo }}">{% endif %}
  <script>
    // Apply the saved colour scheme before the page draws, so it never flashes.
    window.siteTheme = function () {
      var t = document.documentElement.dataset.theme;
      if (t) return t;
      return matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
    };
    (function () {
      var t = null;
      try { t = localStorage.getItem("theme"); } catch (e) {}
      t = t || "{{ site.default_theme }}";
      if (t === "dark" || t === "light") document.documentElement.dataset.theme = t;
    })();
  </script>
  <link rel="alternate" type="application/rss+xml" title="{{ site.title }}" href="{{ url('/feed.xml') }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url('/static/style.css') }}">
</head>
<body>
  <header class="masthead">
    <a class="wordmark" href="{{ url('/') }}">{{ site.title }}</a>
    <nav>
      {% for label, path in site.nav %}
        <a href="{{ url(path) }}"{% if current == path %} aria-current="page"{% endif %}>{{ label }}</a>
      {% endfor %}
      <button class="theme-toggle" type="button" aria-label="Switch between light and dark background" title="Light / dark">
        <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
      </button>
    </nav>
  </header>

  <main>
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <span>&copy; {{ year }} {{ site.author }}</span>
    <span class="footer-links">
      {% for label, href in social.items() %}<a href="{{ href }}">{{ label }}</a>{% endfor %}
      <a href="{{ url('/feed.xml') }}">RSS</a>
    </span>
  </footer>

  <div class="scroll-buttons">
    <button class="to-top" type="button" aria-label="Back to top" title="Back to top" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 15l6-6 6 6"/></svg>
    </button>
    <button class="to-bottom" type="button" aria-label="Go to bottom" title="Go to bottom" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
    </button>
  </div>

  <script>
    // Back to top / go to bottom: each button only shows when it's useful.
    (function () {
      var up = document.querySelector(".to-top");
      var down = document.querySelector(".to-bottom");
      var GAP = 400;
      function update() {
        var y = window.scrollY;
        var end = document.documentElement.scrollHeight - window.innerHeight;
        up.hidden = y < GAP;
        down.hidden = end - y < GAP;
      }
      up.addEventListener("click", function () { window.scrollTo({ top: 0 }); });
      down.addEventListener("click", function () {
        window.scrollTo({ top: document.documentElement.scrollHeight });
      });
      window.addEventListener("scroll", update, { passive: true });
      window.addEventListener("resize", update);
      window.addEventListener("load", update);
      update();
    })();
  </script>

  <script>
    document.querySelector(".theme-toggle").addEventListener("click", function () {
      var next = window.siteTheme() === "dark" ? "light" : "dark";
      document.documentElement.dataset.theme = next;
      try { localStorage.setItem("theme", next); } catch (e) {}
      if (window.CUSDIS && window.CUSDIS.setTheme) window.CUSDIS.setTheme(next);
    });
  </script>
</body>
</html>
